<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EasyTech IT Solutions</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
    <style>
        /* Hero Section */
        .hero {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 60px 20px;
            flex-wrap: wrap;
            background-color: #f5f5f5;
        }
        .hero-text {
            flex: 1 1 400px;
            margin-right: 20px;
        }
        .hero-text h1 {
            font-size: 2.5rem;
            margin-bottom: 15px;
        }
        .hero-text p {
            font-size: 1.2rem;
            margin-bottom: 20px;
        }
        .hero-image {
            flex: 1 1 400px;
            text-align: center;
        }
        .hero-image img {
            max-width: 100%;
            height: auto;
            border-radius: 10px;
        }

        /* Services Grid */
        .services-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-top: 30px;
        }
        .card {
            background: #fff;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            transition: transform 0.3s;
            cursor: pointer;
        }
        .card:hover {
            transform: translateY(-5px);
        }
        .card h3 {
            margin-bottom: 10px;
        }
        .card p {
            margin-bottom: 8px;
        }
        .card-btn {
            display: inline-block;
            margin-top: 10px;
            padding: 8px 15px;
            background-color: #007bff;
            color: #fff;
            text-decoration: none;
            border-radius: 5px;
            transition: background-color 0.3s;
        }
        .card-btn:hover {
            background-color: #0056b3;
        }

        /* Responsive adjustments */
        @media (max-width: 768px) {
            .hero {
                flex-direction: column-reverse;
                text-align: center;
            }
            .hero-text {
                margin: 0;
            }
            .hero-text h1 {
                font-size: 2rem;
            }
            .hero-text p {
                font-size: 1rem;
            }
        }
    </style>
</head>
<body>

<header class="navbar">
    <div class="container nav-container">
        <h2 class="logo">EasyTech</h2>
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="technicians.html">Technicians</a></li>
                <li><a href="request.html">Request Service</a></li>
                <li><a href="requests.html">View Requests</a></li>
                <li><a href="about.html">About</a></li>
            </ul>
        </nav>
    </div>
</header>

<main>
    <!-- Hero Section -->
    <section class="hero">
        <div class="hero-text">
            <h1>EasyTech IT Solutions</h1>
            <p>Your trusted partner for IT services, network setups, software installations, CCTV, and more.</p>
            <a href="request.html" class="btn-primary">Request a Service</a>
        </div>
        <div class="hero-image">
            <img src="https://i.pinimg.com/736x/de/9c/2e/de9c2e51b4e742677b9fc4ec7c35c50f.jpg" alt="IT Solutions">
        </div>
    </section>

    <!-- Services Section -->
    <section class="services-section">
        <h2 class="section-title">Our Services</h2>
        <div id="services-container" class="services-grid"></div>
    </section>
</main>

<footer>
    <div class="container">
        <p>&copy; 2026 EasyTech IT Solutions. All rights reserved.</p>
    </div>
</footer>

<script src="js/script.js"></script>
<script>
    // Render services cards and link to request page
    const servicesContainer = document.getElementById('services-container');
    renderServices(servicesContainer);
</script>

</body>
</html>
