<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EasyTech IT Solutions - View Requests</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
    <style>
        /* Minimal extra styles for admin buttons */
        .card-actions { margin-top: 15px; }
        .delete-btn, .complete-btn {
            cursor: pointer; padding: 6px 12px; margin-right: 8px;
            border: none; border-radius: 5px; color: #fff; font-weight: 500; transition: 0.3s;
        }
        .complete-btn { background-color: #28a745; }
        .delete-btn { background-color: #dc3545; display: none; }
        #login-form { margin-bottom: 20px; }
        #login-form input { padding: 6px; margin-right: 8px; }
        #login-form button { padding: 6px 12px; }
        #notification { margin-bottom: 15px; padding: 10px 15px; border-radius: 5px; background-color: #28a745; color: white; font-weight: 500; display: none; }
    </style>
</head>
<body>

<header class="navbar">
    <div class="container nav-container">
        <h2 class="logo">EasyTech</h2>
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="technicians.html">Technicians</a></li>
                <li><a href="request.html">Request Service</a></li>
                <li><a href="requests.html">View Requests</a></li>
            </ul>
        </nav>
    </div>
</header>

<main>
    <section class="page-section">
        <div class="container">
            <h1 class="section-title">All Service Requests</h1>

            <!-- Notification for newly submitted requests -->
            <div id="notification"></div>

            <!-- Admin login to allow deleting requests -->
            <form id="login-form">
                <input type="text" id="username" placeholder="Username">
                <input type="password" id="password" placeholder="Password">
                <button type="submit">Login</button>
            </form>

            <!-- Dynamic cards for requests -->
            <div id="requests-container" class="services-grid"></div>
        </div>
    </section>
</main>

<footer>
    <div class="container">
        <p>&copy; 2026 EasyTech IT Solutions. All rights reserved.</p>
    </div>
</footer>

<script src="js/script.js"></script>
<script>
    const requestsContainer = document.getElementById('requests-container');
    const loginForm = document.getElementById('login-form');
    const usernameInput = document.getElementById('username');
    const passwordInput = document.getElementById('password');
    const notification = document.getElementById('notification');

    // Display notification for newly submitted requests
    const newNotification = JSON.parse(localStorage.getItem('newRequestNotification'));
    if (newNotification) {
        notification.textContent = newNotification.message;
        notification.style.display = 'block';
        setTimeout(() => notification.style.display = 'none', 5000);
        localStorage.removeItem('newRequestNotification');
    }

    let adminMode = false;

    loginForm.addEventListener('submit', (e) => {
        e.preventDefault();
        if (usernameInput.value === "admin" && passwordInput.value === "admin123") {
            adminMode = true;
            renderRequests(requestsContainer, true);
            alert("Admin mode activated!");
            loginForm.style.display = 'none';
        } else {
            alert("Wrong username or password");
        }
    });

    // Initial rendering of requests (non-admin view)
    renderRequests(requestsContainer, false);
    autoRefreshRequests(requestsContainer, 10000);
</script>

</body>
</html>
