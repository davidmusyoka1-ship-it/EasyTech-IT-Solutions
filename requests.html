<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EasyTech IT Solutions - Requests</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>

<header class="navbar">
    <div class="container nav-container">
        <h2 class="logo">EasyTech</h2>
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="technicians.html">Technicians</a></li>
                <li><a href="request.html">Request Service</a></li>
                <li><a href="requests.html">View Requests</a></li>
            </ul>
        </nav>
    </div>
</header>

<section class="page-section">
    <div class="container">
        <h1 class="section-title">All Service Requests</h1>

        <div id="notification"></div>

        <form id="login-form">
            <input type="text" id="username" placeholder="Username">
            <input type="password" id="password" placeholder="Password">
            <button type="submit">Login</button>
        </form>

        <div id="requests-container" class="services-grid"></div>
    </div>
</section>

<footer>
    <div class="container">
        <p>&copy; 2026 EasyTech IT Solutions. All rights reserved.</p>
    </div>
</footer>

<script src="js/script.js"></script>
<script>
    const requestsContainer = document.getElementById('requests-container');
    const loginForm = document.getElementById('login-form');
    const usernameInput = document.getElementById('username');
    const passwordInput = document.getElementById('password');
    const notification = document.getElementById('notification');

    const newNotification = JSON.parse(localStorage.getItem('newRequestNotification'));
    if (newNotification) {
        notification.textContent = newNotification.message;
        notification.style.display = 'block';
        setTimeout(() => notification.style.display = 'none', 5000);
        localStorage.removeItem('newRequestNotification');
    }

    let adminMode = false;

    loginForm.addEventListener('submit', (e) => {
        e.preventDefault();
        if (usernameInput.value === "admin" && passwordInput.value === "admin123") {
            adminMode = true;
            renderRequests(requestsContainer, true);
            alert("Admin mode activated!");
            loginForm.style.display = 'none';
        } else {
            alert("Wrong username or password");
        }
    });

    renderRequests(requestsContainer, false);
    autoRefreshRequests(requestsContainer, 10000);
</script>

</body>
</html>
